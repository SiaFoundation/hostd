name: Update UI and open PR

on:
  repository_dispatch:
    types: [update-ui]
  # Enable manual trigger
  workflow_dispatch:

jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Update UI and open PR
        uses: SiaFoundation/workflows/.github/actions/ui-update@4b83528b86239995d5d941f1f5c48f17ef9db4d1 # master
        with:
          moduleName: 'hostd'
          goVersion: '1.21'
          token: ${{ secrets.GITHUB_TOKEN }}
