name: Update UI and open PR

on:
  repository_dispatch:
    types: [update-ui]
  # Enable manual trigger
  workflow_dispatch:

jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Update UI and open PR
        uses: SiaFoundation/workflows/.github/actions/ui-update@3d496e2845d325cc657cedfa8ec7aba60953a1c3 # master
        with:
          moduleName: 'hostd'
          goVersion: '1.21'
          token: ${{ secrets.GITHUB_TOKEN }}
