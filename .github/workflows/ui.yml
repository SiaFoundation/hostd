name: Update UI and open PR

on:
  repository_dispatch:
    types: [update-ui]
  # Enable manual trigger
  workflow_dispatch:

jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Update UI and open PR
        uses: SiaFoundation/workflows/.github/actions/ui-update@d5d18a70438976ccb2c525c21dd956dc5639fc32 # master
        with:
          moduleName: 'hostd'
          goVersion: '1.21'
          token: ${{ secrets.GITHUB_TOKEN }}
